<style>
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(assets/fonts/inter-latin-wght-normal.woff2) format('woff2')}
html{background:#0B0B0C}
body{margin:0}
.mb{--bg:#0B0B0C;--raised:#1C1C1E;--pill:#2C2C2E;--ink:#F5F5F7;--ink2:#A1A1A6;--green:#6FCF7A;--amber:#FFC56B;--coral:#FF8A5B;--line:rgba(255,255,255,.1);--btn-bg:#F5F5F7;--btn-ink:#0B0B0C;--nav:rgba(11,11,12,.82);--dim:rgba(245,245,247,.2);--grad:linear-gradient(100deg,#E2FFB0 0%,#9BE58A 42%,#3DDC84 100%);--grad-glow:rgba(61,220,132,.38);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;color-scheme:dark}
.mb.light{--bg:#FFFFFF;--raised:#F4F4F6;--pill:#E6E6EA;--ink:#111111;--ink2:#55555B;--green:#2E7D32;--amber:#9A5B00;--coral:#B4441A;--line:rgba(0,0,0,.12);--btn-bg:#111111;--btn-ink:#FFFFFF;--nav:rgba(255,255,255,.85);--dim:rgba(17,17,17,.18);--grad:linear-gradient(100deg,#2E7D32 0%,#1B8F4E 55%,#0E6E46 100%);--grad-glow:rgba(61,220,132,.26);--grad-glow2:rgba(61,220,132,0);color-scheme:light}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-bottom:0.18em;margin-bottom:-0.18em;filter:drop-shadow(0 0 32px var(--grad-glow)) drop-shadow(0 8px 40px var(--grad-glow2, transparent))}
.hero-drain{animation:herodrain 5s linear forwards}
@keyframes herodrain{0%{height:100%;background-color:#6FCF7A}48%{background-color:#6FCF7A}54%{background-color:#FFC56B}76%{background-color:#FFC56B}82%{background-color:#FF8A5B}100%{height:4%;background-color:#FF8A5B}}
@keyframes capA{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes capB{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes capC{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cap-a{animation:capA .4s ease-out}.cap-b{animation:capB .4s ease-out}.cap-c{animation:capC .4s ease-out}
@media (prefers-reduced-motion: reduce){.cap-a,.cap-b,.cap-c{animation:none}}
.cursor{transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1),opacity .3s ease,transform .15s ease}
@keyframes rcFill{0%{height:14%;background-color:#FF8A5B}45%{background-color:#FFC56B}100%{height:100%;background-color:#6FCF7A}}
@keyframes rcWave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes rcBub{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-18cqw);opacity:0}}
@keyframes rcGlow{0%{box-shadow:0 0 0 0 rgba(111,207,122,0)}40%{box-shadow:0 0 5cqw 1cqw rgba(111,207,122,.55)}100%{box-shadow:0 0 2.5cqw 0 rgba(111,207,122,.22)}}
@keyframes rcRipple{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.9);opacity:0}}
@keyframes rcPop{0%{transform:translateY(3.5cqw) scale(0) rotate(-20deg);opacity:0}60%{transform:translateY(-.8cqw) scale(1.2) rotate(8deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes rcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-.6cqw)}}
@keyframes rcRise{0%{transform:translateY(1.6cqw);opacity:0}100%{transform:none;opacity:1}}
@keyframes rcHalo{0%{opacity:.35;transform:scale(.8)}60%{opacity:1;transform:scale(1.08)}100%{opacity:.8;transform:scale(1)}}
@keyframes rcP1{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(-8.3cqw,-6.1cqw) scale(.2);opacity:0}}
@keyframes rcP2{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(8.3cqw,-6.7cqw) scale(.2);opacity:0}}
@keyframes rcP3{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(-5cqw,-10.5cqw) scale(.2);opacity:0}}
@keyframes rcP4{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(5.6cqw,-11.1cqw) scale(.2);opacity:0}}
@keyframes rcP5{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(-10.5cqw,-1.1cqw) scale(.2);opacity:0}}
@keyframes rcP6{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(10.5cqw,-1.7cqw) scale(.2);opacity:0}}
@keyframes rcP7{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(-1.1cqw,-12.8cqw) scale(.2);opacity:0}}
@keyframes rcP8{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(2.2cqw,-8.3cqw) scale(.2);opacity:0}}
.rc-fill{animation:rcFill 1.5s cubic-bezier(.3,.7,.2,1) .2s both}
.rc-wave{animation:rcWave 1.4s linear infinite}
.rc-b1{animation:rcBub 2.4s ease-in .3s infinite}.rc-b2{animation:rcBub 2.8s ease-in .7s infinite}.rc-b3{animation:rcBub 2.2s ease-in 1s infinite}.rc-b4{animation:rcBub 3s ease-in .5s infinite}
.rc-glow{animation:rcGlow 1.6s ease-out 1.5s both}
.rc-r1{animation:rcRipple 1.4s ease-out 1.5s both}.rc-r2{animation:rcRipple 1.4s ease-out 1.75s both}
.rc-pop{animation:rcPop .8s cubic-bezier(.2,.8,.2,1.2) 1.5s both}
.rc-float{animation:rcFloat 3s ease-in-out 2.3s infinite}
.rc-p1{animation:rcP1 1.1s ease-out 1.55s both}.rc-p2{animation:rcP2 1.1s ease-out 1.6s both}.rc-p3{animation:rcP3 1.2s ease-out 1.55s both}.rc-p4{animation:rcP4 1.2s ease-out 1.65s both}
.rc-p5{animation:rcP5 1s ease-out 1.6s both}.rc-p6{animation:rcP6 1s ease-out 1.55s both}.rc-p7{animation:rcP7 1.3s ease-out 1.6s both}.rc-p8{animation:rcP8 1.1s ease-out 1.7s both}
.rc-rise2{animation:rcRise .6s cubic-bezier(.2,.8,.2,1) 1.6s both}.rc-rise5{animation:rcRise .6s cubic-bezier(.2,.8,.2,1) 1.9s both}
.rc-halo{animation:rcHalo 2s ease-out .2s both}
@media (prefers-reduced-motion: reduce){.rc-fill,.rc-wave,.rc-b1,.rc-b2,.rc-b3,.rc-b4,.rc-glow,.rc-r1,.rc-r2,.rc-pop,.rc-float,.rc-p1,.rc-p2,.rc-p3,.rc-p4,.rc-p5,.rc-p6,.rc-p7,.rc-p8,.rc-rise2,.rc-rise5,.rc-halo{animation:none}}
.mb a{color:var(--ink)}
.mb a:hover{color:var(--green)}
.mb a.pill-primary,.mb a.pill-primary:hover{color:var(--btn-ink)}
.mb a:focus-visible,.mb button:focus-visible,.mb summary:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.pill-primary,.pill-outline{transition:transform .15s ease}
.pill-primary:hover,.pill-outline:hover{transform:translateY(-1px)}
.demo{container-type:inline-size}
.cdot{display:block;width:1cqw;height:1cqw;border-radius:50%;background:#4A4A4E}
.fill{transition:height .25s linear,background-color .6s ease}
.ring{transition:stroke-dashoffset .25s linear}
.tab-in{animation:tabin .35s ease-out}
.fade-in{animation:fadein .45s ease-out}
.caret{animation:blink 1s steps(1) infinite}
@keyframes tabin{from{opacity:0;transform:translateY(40%)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.fill,.ring,.tab-in,.fade-in,.caret,.hero-drain,.cursor{transition:none;animation:none}}
.faq summary{list-style:none;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq .plus{transition:transform .2s ease}
.faq details[open] .plus{transform:rotate(45deg)}
.only-mob{display:none}
.only-mob-demo{display:none}
@media (max-width:720px){
.only-desk-demo{display:none !important}
.only-mob-demo{display:block !important}
.only-desk{display:none !important}
.only-mob{display:flex !important}
.nav-links,.nav-cta{display:none !important}
.feat,.feat.rev{flex-direction:column !important}
.mb footer{padding-bottom:84px}
}
@keyframes dealA{from{opacity:0;transform:translateY(14px) rotate(-2deg) scale(.96)}to{opacity:1;transform:none}}
@keyframes dealB{from{opacity:0;transform:translateY(14px) rotate(2deg) scale(.96)}to{opacity:1;transform:none}}
.deal-a{animation:dealA .45s cubic-bezier(.2,.8,.2,1)}
.deal-b{animation:dealB .45s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.deal-a,.deal-b{animation:none}}
</style>

    this._starts.hero = Date.now(); // the hero is above the fold: start right away
    const startAll = () => {
      const now = Date.now();
      ['hero', 'lock', 'skip'].forEach((k) => { if (this._starts[k] == null) this._starts[k] = now; });
    };
    if (typeof IntersectionObserver !== 'undefined') {
      this._io = new IntersectionObserver((entries) => {
        this._ioFired = true;
        entries.forEach((en) => {
          const key = en.target.getAttribute('data-demo');
          if (en.isIntersecting && this._starts[key] == null) {
            this._starts[key] = Date.now();
            this._io.unobserve(en.target);
          }
        });
      }, { threshold: 0 });
      const els = this._els || {};
      ['hero', 'lock', 'skip'].forEach((k) => { if (els[k]) this._io.observe(els[k]); });
      // Safety net: if the observer never reports (some embedded previews), start everything.
      this._fallback = setTimeout(() => { if (!this._ioFired) startAll(); }, 1500);
    } else {
      startAll();
    }
    this._iv = setInterval(() => this.setState({ now: Date.now() }), TICK);
  }
  _demoRef(key) {
    this._refFns = this._refFns || {};
    if (!this._refFns[key]) {
      this._refFns[key] = (el) => {
        this._els = this._els || {};
        if (this._io && this._els[key] && this._els[key] !== el) this._io.unobserve(this._els[key]);
        this._els[key] = el;
        if (el && this._io && (this._starts || {})[key] == null) this._io.observe(el);
      };
    }
    return this._refFns[key];
  }
  componentWillUnmount() {
    if (this._iv) clearInterval(this._iv);
    if (this._io) this._io.disconnect();
    if (this._fallback) clearTimeout(this._fallback);
    if (this._onScroll) {
      window.removeEventListener('scroll', this._onScroll, true);
      window.removeEventListener('resize', this._onScroll);
    }
    if (this._raf) cancelAnimationFrame(this._raf);
  }
  renderVals() {
    const s = this.state || {};
    const theme = s.theme || this.props.theme || 'dark';
    const live = this.props.storeLive ?? true;
    const running = !!this._running;
    const now = s.now || Date.now();
    const starts = this._starts || {};
    const elapsed = (k) => (starts[k] == null ? 0 : now - starts[k]);
    const mi = s.mi || 0;
    const pageUrl = (typeof location !== 'undefined' && location.href) || '';
    const linkToSend = live ? STORE_URL : pageUrl;
    const mp = s.mp || 0;
    const n = MANIFESTO.length;
    if (!this._mref) this._mref = (el) => { this._m = el; };
    return {
      manifestoRef: this._mref,
      words: MANIFESTO.map((w, i) => ({ text: i < n - 1 ? w + ' ' : w, color: (i + 0.5) / n <= mp ? 'var(--ink)' : 'var(--dim)' })),
      themeClass: theme === 'light' ? 'light' : 'dark',
      isDark: theme !== 'light',
      isLight: theme === 'light',
      themeLabel: theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme',
      toggleTheme: () => this.setState({ theme: theme === 'light' ? 'dark' : 'light' }),
      storeUrl: STORE_URL,
      githubUrl: GITHUB_URL,
      ctaNav: live ? 'Add to Chrome' : 'Coming soon',
      ctaHero: live ? 'Add to Chrome' : 'Coming soon to the Chrome Web Store',
      ctaMobile: live ? 'Add to Chrome on your computer' : 'Coming soon to the Chrome Web Store',
      hero: heroFrame(running ? elapsed('hero') % 8500 : 2600, running && starts.hero != null),
      lock: lockFrame(running ? elapsed('lock') % 20500 : 6000),
      skip: skipFrame(running ? elapsed('skip') % 13500 : 4700),
      heroRef: this._demoRef('hero'),
      lockRef: this._demoRef('lock'),
      skipRef: this._demoRef('skip'),
      mission: Object.assign({}, MISSIONS[mi], { cls: s.deal ? 'deal-a' : 'deal-b' }),
      shuffle: () => {
        let next = mi;
        while (next === mi) next = Math.floor(Math.random() * MISSIONS.length);
        this.setState({ mi: next, deal: !s.deal });
      },
      mailtoUrl: 'mailto:?subject=' + encodeURIComponent('micro.breaks: install on my computer') + '&body=' + encodeURIComponent('Stop sitting. Start moving. Add micro.breaks to Chrome: ' + linkToSend),
      shareLabel: s.copied ? 'Link copied' : 'Share the link',
      shareLink: () => {
        const url = (typeof location !== 'undefined' && location.href) || '';
        const data = { title: 'micro.breaks', text: 'Stop sitting. Start moving. Open this on your computer.', url: url };
        if (navigator.share) { navigator.share(data).catch(() => {}); return; }
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(() => {
            this.setState({ copied: true });
            setTimeout(() => this.setState({ copied: false }), 2500);
          }).catch(() => {});
        }
      }
    };
  }
}
mountPage(Component, {"theme": "dark", "storeLive": true, "animate": true});
})();
